name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve the same benchmark harness for both revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          cp benchmarks/performance.cr "$RUNNER_TEMP/performance.cr"
          cp benchmarks/compare.py "$RUNNER_TEMP/compare.py"
          git fetch origin "$BASE_SHA"
          git fetch origin "$HEAD_SHA"

      - name: Benchmark base
        run: |
          git checkout "$BASE_SHA"
          mkdir -p benchmarks
          cp "$RUNNER_TEMP/performance.cr" benchmarks/performance.cr
          crystal build benchmarks/performance.cr --release -o "$RUNNER_TEMP/router-base"
          "$RUNNER_TEMP/router-base" > "$RUNNER_TEMP/baseline.jsonl"
          if git cat-file -e "$BASE_SHA:benchmarks/performance.cr" 2>/dev/null; then
            git restore --source="$BASE_SHA" --worktree -- benchmarks/performance.cr
          else
            rm benchmarks/performance.cr
          fi

      - name: Benchmark PR
        run: |
          git checkout "$HEAD_SHA"
          cp "$RUNNER_TEMP/performance.cr" benchmarks/performance.cr
          crystal build benchmarks/performance.cr --release -o "$RUNNER_TEMP/router-head"
          "$RUNNER_TEMP/router-head" > "$RUNNER_TEMP/contender.jsonl"

      - name: Compare results
        run: |
          python3 "$RUNNER_TEMP/compare.py" "$RUNNER_TEMP/baseline.jsonl" "$RUNNER_TEMP/contender.jsonl" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: router-performance
          path: |
            ${{ runner.temp }}/baseline.jsonl
            ${{ runner.temp }}/contender.jsonl
            ${{ runner.temp }}/report.md
